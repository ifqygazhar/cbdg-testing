        const productConfigs = {
          codebuddy: {
            productName: "CodeBuddy",
            logo: "//codebuddy-1328495429.cos.accelerate.myqcloud.com/web/ide/avatar-white.svg",
            videoPoster:
              "https://codebuddy-1328495429.cos.accelerate.myqcloud.com/web/ide/started-poster.png",
            videoSrc:
              "https://dscache-intl.cloudcachetci.com/upload/uploader/video-4f783c743d7cab970ff83d874d4f13b287528ef8.mp4",
            termsUrl: "/document/term",
            privacyUrl: "/document/privacy-policy",
            dpsaUrl: "/document/dpsa",
            chinaSiteUrl: "https://www.codebuddy.cn",
            contactUrl: "mailto:codebuddy@tencent.com",
            serviceAgreementText: "Tencent Cloud CodeBuddy Service Agreement",
            confirmTitleText: "Service Agreement and Privacy Terms",
          },
          workbuddy: {
            productName: "WorkBuddy",
            logo: "/auth/resources/6rd0u/login/ide-oversea/img/workbuddy-logo.png",
            videoPoster:
              "//acc-1258344699.cos.accelerate.myqcloud.com/web/login/4ca1c1d5a3081f9924afca9499a7ef0679601d03/assets/workbuddy-cat-poster.c04229e3.png",
            videoSrc:
              "//acc-1258344699.cos.accelerate.myqcloud.com/web/login/4ca1c1d5a3081f9924afca9499a7ef0679601d03/assets/workbuddy-cat.c32542ad.mp4",
            termsUrl: "/document/term",
            privacyUrl: "/document/privacy-policy",
            dpsaUrl: "/document/dpsa",
            chinaSiteUrl: "https://www.workbuddy.cn",
            contactUrl: "https://www.tencentcloud.com/zh/contact-us",
            serviceAgreementText: "Tencent Cloud CodeBuddy Service Agreement",
            confirmTitleText: "Service Agreement and Privacy Terms",
          },
        };

        function appendProductParam(value, product) {
          if (!value) {
            return value;
          }
          try {
            const targetUrl = new URL(value, window.location.href);
            targetUrl.searchParams.set("product", product);
            return targetUrl.href;
          } catch (e) {
            return value;
          }
        }

        function applyProductConfig(config) {
          const currentProduct =
            document.documentElement.dataset.product || "codebuddy";
          const logo = document.querySelector("[data-product-logo]");
          const heroVideo = document.getElementById("product-hero-video");

          if (logo) {
            logo.src = config.logo;
            logo.alt = config.productName;
          }
          document
            .querySelectorAll("[data-product-name]")
            .forEach(function (node) {
              node.textContent = config.productName;
            });
          if (heroVideo) {
            heroVideo.poster = config.videoPoster;
            if (heroVideo.getAttribute("src") !== config.videoSrc) {
              heroVideo.src = config.videoSrc;
              heroVideo.load();
            }
          }
          document
            .querySelectorAll("[data-product-terms-link]")
            .forEach(function (link) {
              link.href = config.termsUrl;
            });
          document
            .querySelectorAll("[data-product-privacy-link]")
            .forEach(function (link) {
              link.href = config.privacyUrl;
            });
          document
            .querySelectorAll("[data-product-dpsa-link]")
            .forEach(function (link) {
              link.href = config.dpsaUrl;
            });
          document
            .querySelectorAll("[data-product-service-agreement]")
            .forEach(function (node) {
              node.textContent = config.serviceAgreementText;
            });
          document
            .querySelectorAll("[data-product-confirm-title]")
            .forEach(function (node) {
              node.textContent = config.confirmTitleText;
            });
          document
            .querySelectorAll("[data-product-china-link]")
            .forEach(function (link) {
              link.href = config.chinaSiteUrl;
            });
          document
            .querySelectorAll("[data-product-contact-link]")
            .forEach(function (link) {
              link.href = config.contactUrl;
            });
          document
            .querySelectorAll("a[data-product-preserve]")
            .forEach(function (link) {
              link.href = appendProductParam(link.href, currentProduct);
            });
          document
            .querySelectorAll("form[data-product-preserve]")
            .forEach(function (form) {
              form.action = appendProductParam(form.action, currentProduct);
            });
        }

        try {
          const productStorageKey = "CURRENT_BUDDY_PROODUCT";
          const urlParams = new URLSearchParams(window.location.search);
          const urlProduct = urlParams.get("product");
          const storageProduct = sessionStorage.getItem(productStorageKey);
          const product = urlProduct || storageProduct || "codebuddy";
          const safeProduct = /^[a-z0-9-]+$/i.test(product)
            ? product
            : "codebuddy";
          const currentProduct = productConfigs[safeProduct]
            ? safeProduct
            : "codebuddy";
          const currentConfig = productConfigs[currentProduct];
          if (urlProduct) {
            sessionStorage.setItem(productStorageKey, currentProduct);
          }
          document.documentElement.dataset.product = currentProduct;
          window.__LOGIN_PRODUCT_CONFIG__ = currentConfig;
          window.applyLoginProductConfig = function () {
            applyProductConfig(currentConfig);
          };

          document.addEventListener(
            "DOMContentLoaded",
            window.applyLoginProductConfig,
          );
        } catch (e) {
          document.documentElement.dataset.product = "codebuddy";
          window.__LOGIN_PRODUCT_CONFIG__ = productConfigs.codebuddy;
          window.applyLoginProductConfig = function () {
            applyProductConfig(productConfigs.codebuddy);
          };
          console.error("[Product] Error detecting product:", e);
        }
      })();
    </script>

    <script>
      // Auto-detect and switch language based on localStorage
      (function () {
        try {
          const storedLang = localStorage.getItem("CODEBUDDY_IDE_STORAGE_LANG");
          if (!storedLang) {
            return;
          }

          // 映射 IDE 语言到 Keycloak 语言标签
          // en-US -> en, zh-CN -> zh-CN
          const langMapping = {
            "en-US": "en",
            "zh-CN": "zh-CN",
          };

          const targetLocale = langMapping[storedLang] || storedLang;
          const currentLocale = "en";

          console.log(
            "[Language] Stored language:",
            storedLang,
            "-> Mapped to:",
            targetLocale,
            "Current:",
            currentLocale,
          );

          // 如果当前语言与存储的语言不匹配，则切换
          if (targetLocale && targetLocale !== currentLocale) {
            // 查找对应的语言URL
            const supportedLocales = {
              "zh-CN":
                "/auth/realms/copilot/login-actions/first-broker-login?client_id=console&amp;tab_id=ketyJtTAkvs&amp;client_data=eyJydSI6Imh0dHBzOi8vd3d3LmNvZGVidWRkeS5haS9sb2dpbi9zZWxlY3Q_cmVkaXJlY3RfdXJpPWh0dHBzJTNBJTJGJTJGd3d3LmNvZGVidWRkeS5haSUyRnByaWNpbmciLCJydCI6ImNvZGUifQ&amp;execution=a1721c87-6b56-4f52-a578-74b08c00e9ea&amp;kc_locale=zh-CN",
              en: "/auth/realms/copilot/login-actions/first-broker-login?client_id=console&amp;tab_id=ketyJtTAkvs&amp;client_data=eyJydSI6Imh0dHBzOi8vd3d3LmNvZGVidWRkeS5haS9sb2dpbi9zZWxlY3Q_cmVkaXJlY3RfdXJpPWh0dHBzJTNBJTJGJTJGd3d3LmNvZGVidWRkeS5haSUyRnByaWNpbmciLCJydCI6ImNvZGUifQ&amp;execution=a1721c87-6b56-4f52-a578-74b08c00e9ea&amp;kc_locale=en",
            };

            const targetUrl = supportedLocales[targetLocale];
            if (targetUrl) {
              console.log(
                "[Language] Auto-switching from",
                currentLocale,
                "to",
                targetLocale,
              );
              window.location.href = targetUrl;
            }
          }
        } catch (e) {
          console.error("[Language] Error detecting language:", e);
        }
      })();
    </script>
    <script>
      (function () {
        function getStorageLanguage(localeTag) {
          return localeTag && localeTag.indexOf("zh") === 0 ? "zh-CN" : "en-US";
        }

        document.addEventListener("DOMContentLoaded", function () {
          const dropdown = document.getElementById("kc-locale-dropdown");

          document
            .querySelectorAll("[data-locale-switch]")
            .forEach(function (link) {
              link.addEventListener("click", function () {
                const localeTag = link.getAttribute("data-locale-tag");
                localStorage.setItem(
                  "CODEBUDDY_IDE_STORAGE_LANG",
                  getStorageLanguage(localeTag),
                );
              });
            });

          document.addEventListener("click", function (event) {
            if (
              !dropdown ||
              !dropdown.open ||
              dropdown.contains(event.target)
            ) {
              return;
            }

            dropdown.open = false;
          });
        });
      })();
    </script>

    <script type="module">
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a[data-once-link]");
        if (!link) {
          return;
        }
        if (link.getAttribute("aria-disabled") === "true") {
          event.preventDefault();
          return;
        }
        const { disabledClass } = link.dataset;
        if (disabledClass) {
          link.classList.add(...disabledClass.trim().split(/\s+/));
        }
        link.setAttribute("role", "link");
        link.setAttribute("aria-disabled", "true");
      });
    </script>

    <script>
      // Maintenance Notice Functions

      // 获取调整后的配置（测试域名下自动修改时间范围）
      function getAdjustedConfig() {
        const config = { ...MAINTENANCE_CONFIG };
        const hostname = window.location.hostname;

        // 仅在 staging-codebuddy.tencent.com 域名下进行时间调整
        if (hostname === "staging-codebuddy.tencent.com") {
          const now = new Date();
          const offsetMs = (config.timezoneOffset || 0) * 60 * 60 * 1000;
          const currentTime = new Date(now.getTime() + offsetMs);

          // 计算当前小时的00分和40分
          const currentHourStart = new Date(currentTime);
          currentHourStart.setMinutes(0, 0, 0);

          const currentHourEnd = new Date(currentTime);
          currentHourEnd.setMinutes(40, 59, 999);

          // 修改配置的时间范围为当前小时的00:00到40:59
          config.displayStartTime = currentHourStart.toISOString();
          config.displayEndTime = currentHourEnd.toISOString();

          console.log(
            "[Maintenance Notice] [Staging Test Mode] Adjusted time range:",
            currentHourStart.toLocaleString(),
            "to",
            currentHourEnd.toLocaleString(),
          );
        }

        return config;
      }

      // 检查当前时间是否在显示时间段内
      function isInDisplayTimeRange() {
        const config = getAdjustedConfig();

        // 如果没有配置时间段，默认显示
        if (!config.displayStartTime && !config.displayEndTime) {
          return true;
        }

        // 获取当前时间（考虑时区偏移）
        const now = new Date();
        const offsetMs = (config.timezoneOffset || 0) * 60 * 60 * 1000;
        const currentTime = new Date(now.getTime() + offsetMs);

        // 检查开始时间
        if (config.displayStartTime) {
          const startTime = new Date(config.displayStartTime);
          if (currentTime < startTime) {
            return false; // 还未到开始时间
          }
        }

        // 检查结束时间
        if (config.displayEndTime) {
          const endTime = new Date(config.displayEndTime);
          if (currentTime > endTime) {
            return false; // 已过结束时间
          }
        }

        return true;
      }

      // 关闭维护通知
      function closeMaintenance() {
        const notice = document.getElementById("maintenance-notice");
        if (notice) {
          notice.style.display = "none";
          notice.classList.add("hidden");

          // 保存关闭状态到 localStorage
          const closeData = {
            closed: true,
            timestamp: new Date().toISOString(),
            config: {
              startTime: MAINTENANCE_CONFIG.displayStartTime,
              endTime: MAINTENANCE_CONFIG.displayEndTime,
            },
          };
          // localStorage.setItem('maintenance-notice-closed', JSON.stringify(closeData));
          console.log("[Maintenance Notice] Closed by user");
        }
      }

      // 检查用户是否已关闭当前配置的通知
      function isNoticeClosed() {
        try {
          const closedData = localStorage.getItem("maintenance-notice-closed");
          if (!closedData) {
            return false;
          }

          const data = JSON.parse(closedData);

          // 如果配置的时间段发生变化，则认为是新的通知
          if (
            data.config.startTime !== MAINTENANCE_CONFIG.displayStartTime ||
            data.config.endTime !== MAINTENANCE_CONFIG.displayEndTime
          ) {
            return false;
          }

          return data.closed === true;
        } catch (e) {
          console.error("[Maintenance Notice] Error parsing closed data:", e);
          // 如果解析失败，清除旧数据
          localStorage.removeItem("maintenance-notice-closed");
          return false;
        }
      }

      // 初始化维护通知
      function initMaintenanceNotice() {
        // 检查是否启用
        if (!MAINTENANCE_CONFIG.enabled) {
          console.log("[Maintenance Notice] Disabled by config");
          return;
        }

        // 检查是否在显示时间段内
        if (!isInDisplayTimeRange()) {
          console.log("[Maintenance Notice] Not in display time range");
          return;
        }

        // 检查用户是否已关闭通知
        //if (isNoticeClosed()) {
        //    console.log('[Maintenance Notice] Already closed by user');
        //    return;
        //}

        // 填充内容
        document.getElementById("maintenance-title-text").textContent =
          MAINTENANCE_CONFIG.title;
        document.getElementById("maintenance-datetime-text").textContent =
          MAINTENANCE_CONFIG.datetime;
        document.getElementById("maintenance-desc-text").textContent =
          MAINTENANCE_CONFIG.description;
        document.getElementById("maintenance-thanks-text").textContent =
          " " + MAINTENANCE_CONFIG.thanks;

        // 显示通知
        const notice = document.getElementById("maintenance-notice");
        if (notice) {
          notice.style.display = "block";
          console.log("[Maintenance Notice] Displayed");
        }

        // 绑定关闭按钮事件
        const closeBtn = document.getElementById("maintenance-close-btn");
        if (closeBtn) {
          closeBtn.addEventListener("click", closeMaintenance);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        // 初始化维护通知
        initMaintenanceNotice();

        // 支持多个alert时也能用
        document.querySelectorAll(".alert-close-icon").forEach(function (icon) {
          icon.addEventListener("click", function () {
            // 获取最近的.alert祖先并隐藏它
            var alertBox = icon.closest(".alert-info");
            if (alertBox) {
              alertBox.style.visibility = "hidden";
            }
          });
        });
      });
    </script>
  </body>
</html>
